<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vector Racer</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="bar">
      <h1 class="brand">Vector Racer</h1>
      <label class="field">
        <span>Track</span>
        <select id="track-select"></select>
      </label>
      <dl class="stats">
        <div>
          <dt>Turn</dt>
          <dd id="stat-turn">0</dd>
        </div>
        <div>
          <dt>Speed</dt>
          <dd id="stat-speed">0</dd>
        </div>
        <div>
          <dt>Checkpoints</dt>
          <dd id="stat-cp">0 / 0</dd>
        </div>
        <div>
          <dt>Par</dt>
          <dd id="stat-par">…</dd>
        </div>
      </dl>
      <div class="actions">
        <!-- Dev builds only: the solver's best line, for testing tracks. -->
        <button id="btn-best" class="dev-only" type="button" aria-pressed="false" title="Show the best line (B)" hidden>
          Best line
        </button>
        <button id="btn-watch" class="dev-only" type="button" title="Watch the best lap (G)" hidden>Watch best</button>
        <button id="btn-restart" type="button" title="Restart (R)">Restart</button>
        <button id="btn-board" type="button" aria-pressed="false" title="Leaderboard (L)">Leaderboard</button>
        <button id="btn-name" type="button" class="racer" title="Change your racer name">…</button>
        <form id="name-form" class="racer-form" hidden>
          <input id="name-input" aria-label="Racer name" autocomplete="nickname" spellcheck="false" maxlength="16" />
        </form>
      </div>
    </header>

    <main class="stage">
      <canvas id="board"></canvas>
      <p id="toast" class="toast" role="status" aria-live="polite" hidden></p>
      <section id="finish" class="finish" hidden>
        <h2>Finished in <span id="finish-turns">0</span> turns</h2>
        <p id="finish-detail"></p>
        <p id="finish-submit" class="submit-status" role="status" aria-live="polite"></p>
        <div class="actions">
          <button id="finish-copy" type="button">Copy run</button>
          <button id="finish-board" type="button">Leaderboard</button>
          <button id="finish-restart" type="button" class="primary">Race again</button>
        </div>
      </section>

      <aside id="board-panel" class="drawer" hidden aria-labelledby="board-title">
        <header>
          <h2 id="board-title">Leaderboard</h2>
          <button id="board-close" type="button" aria-label="Close leaderboard">×</button>
        </header>
        <p id="board-sub" class="muted"></p>
        <ol id="board-list" class="board"></ol>
        <p id="board-me" class="muted"></p>
      </aside>
    </main>

    <footer class="help">
      Click a dot to pick your next position. Keys: numpad 1–9 or Q W E / A S D / Z X C · R restart · L leaderboard
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
